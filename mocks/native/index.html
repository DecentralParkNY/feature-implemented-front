<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feature Not Found</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#eee;font-family:'Courier New',monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
.hero{text-align:center;position:relative}
h1{font-size:clamp(3rem,10vw,7rem);font-weight:900;letter-spacing:.08em;color:#e94560;position:relative;animation:glitch 3s infinite}
h1::before,h1::after{content:'404 FEATURE';position:absolute;left:0;top:0;width:100%;height:100%}
h1::before{color:#e94560;animation:g1 2s infinite;clip-path:inset(0 0 60% 0)}
h1::after{color:#eee;animation:g2 2.5s infinite;clip-path:inset(40% 0 0 0);opacity:.4}
@keyframes g1{0%,100%{transform:none}20%{transform:translate(-3px,2px)}40%{transform:translate(3px,-1px)}60%{transform:translate(-2px,1px)}}
@keyframes g2{0%,100%{transform:none}25%{transform:translate(2px,-2px)}50%{transform:translate(-3px,1px)}75%{transform:translate(1px,2px)}}
.subtitle{font-size:1.1rem;color:#eee;opacity:.7;margin:1.5rem 0 3rem;height:1.4em}
.btn{background:transparent;border:2px solid #e94560;color:#e94560;font-family:inherit;font-size:1.2rem;padding:.9rem 2.4rem;cursor:pointer;position:relative;transition:background .2s,color .2s;animation:pulse 2s ease-in-out infinite}
.btn:hover{background:#e94560;color:#1a1a2e}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #e9456066}50%{box-shadow:0 0 0 12px #e9456000}}
.counter{margin-top:2rem;font-size:.95rem;opacity:.5}.counter span{color:#e94560;font-weight:700;font-size:1.3rem}
.shake{animation:shake .5s ease-in-out}
@keyframes shake{0%,100%{transform:none}10%{transform:translate(-6px,3px) rotate(-1deg)}30%{transform:translate(5px,-4px) rotate(1deg)}50%{transform:translate(-4px,2px) rotate(-0.5deg)}70%{transform:translate(4px,-2px) rotate(0.5deg)}90%{transform:translate(-2px,1px) rotate(0deg)}}
</style>
</head>
<body>
<div class="hero">
<h1>404 FEATURE</h1>
<div class="subtitle" id="sub"></div>
<button class="btn" id="req">Request Feature</button>
<div class="counter">Features Not Implemented: <span id="count">0</span></div>
</div>
<script>
const msgs=['This button does nothing','Coming eventually\u2122','Works on my machine','TODO: implement everything','Deprecated before release','It\u2019s a feature, not a bug','Blocked by design','Shipped to /dev/null'];
let i=0,count=0;
const sub=document.getElementById('sub'),ct=document.getElementById('count');
function cycle(){sub.style.opacity=0;setTimeout(()=>{sub.textContent=msgs[i];sub.style.opacity=1;i=(i+1)%msgs.length},300)}
sub.style.transition='opacity .3s';cycle();setInterval(cycle,2800);
document.getElementById('req').addEventListener('click',()=>{count++;ct.textContent=count;document.body.classList.remove('shake');void document.body.offsetWidth;document.body.classList.add('shake')});
document.body.addEventListener('animationend',()=>document.body.classList.remove('shake'));
</script>
</body>
</html>
